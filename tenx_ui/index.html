:root{--bg:#f5f7fb;--ink:#253044;--violet:#6256d9;--teal:#2aa9a1;--pink:#d85586;--line:#dfe4ec;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px 'Inter','Segoe UI',sans-serif}.motion-head{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:14px}.motion-head b{font-size:18px}.motion-person{margin-left:auto;padding:7px 10px;background:#f0efff;color:var(--violet);border-radius:20px}.motion-app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 68px)}.motion-nav{padding:12px;background:#fff;border-right:1px solid var(--line);overflow:auto;height:calc(100vh - 68px);position:sticky;top:68px}.motion-nav button{width:100%;border:0;background:transparent;text-align:left;padding:8px;border-radius:8px;color:#697386;cursor:pointer}.motion-nav button.on{background:#f0efff;color:var(--violet);font-weight:700}.motion-main{padding:18px 22px}.motion-title h1{margin:0;font-size:25px}.motion-title p{color:#738095;margin:6px 0 14px}.motion-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.motion-body{height:390px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;position:relative}.motion-stick{position:relative;width:180px;height:330px}.joint{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 5px #6256d91a}.bone{position:absolute;height:5px;background:#9ca5b8;transform-origin:left center;border-radius:5px}.motion-badge{position:absolute;right:14px;top:14px;background:#edf9f8;color:var(--teal);padding:7px 10px;border-radius:12px}.motion-data{display:grid;grid-template-columns:1fr 1fr;gap:10px}.motion-card{background:white;border:1px solid var(--line);border-radius:14px;padding:12px}.motion-card h3{font-size:11px;text-transform:uppercase;color:#8490a1;margin:0 0 8px}.motion-card strong{font-size:22px;color:var(--violet)}.motion-wave{height:110px;po usion Quality show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Cross-sensor consistency, missingness and confidence weighting before state estimation","evidence":"Evidence object: Cross-sensor consistency, missingness and confidence weighting before state estimation; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable fusion quality evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Fusion Quality evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Biomechanics","engineering_question":"What does Biomechanics show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Joint-angle, bilateral asymmetry and movement-quality feature computation","evidence":"Evidence object: Joint-angle, bilateral asymmetry and movement-quality feature computation; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable biomechanics evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Biomechanics evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Gait Analysis","engineering_question":"What does Gait Analysis show that would change the rehabilitation progression / hold / reassessment for the current sess imates","evidence":"Evidence object: Functional status scoring from observed movement features and validated state estimates; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable assessment evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Assessment evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Safety Envelope","engineering_question":"What does Safety Envelope show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Explicit progression constraints, uncertainty margins and no-go conditions","evidence":"Evidence object: Explicit progression constraints, uncertainty margins and no-go conditions; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable safety envelope evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Safety Envelope evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Hidden-State Model","engineering_question":"What does Hidden-State Model show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Gaussian HMM state probabilities and transition evidence across sequential observations","evidence":"Evidence object: Gaussian HMM state probabilities and transition evidenc "Auditable longitudinal evidence evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Longitudinal Evidence evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Population Lab","engineering_question":"What does Population Lab show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Cohort/reference comparison without allowing population averages to override patient safety","evidence":"Evidence object: Cohort/reference comparison without allowing population averages to override patient safety; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable population lab evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Population Lab evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Uncertainty","engineering_question":"What does Uncertainty show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Sensor, state, model and policy uncertainty decomposition with abstention thresholds","evidence":"Evidence object: Sensor, state, model and policy uncertainty decomposition with abstention thresholds; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable uncertainty evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Uncertainty evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"AI Rehab Planner","engineering_question":"What does AI Rehab Planner show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Tool-using planner combining state estimation, APACE, MOTION-GUARD and twin forecasts","evidence":"Evidence object: Tool-using planner combining state estimation, APACE, MOTION-GUARD and twin forecasts; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable ai rehab planner evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the AI Rehab Planner evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Research Evidence","engineering_question":"What does Research Evidence show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Oracle/regret, safety, sensitivity and synthetic-vs-clinical evidence boundaries","evidence":"Evidence object: Oracle/regret, safety, sensitivity and synthetic-vs-clinical evidence boundaries; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable research evidence evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Research Evidence evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Clinical Review","engineering_question":"What does Clinical Review show that would change the rehabilitation progression / hold / reassessment for the current session / movement state scope?","method":"Clinician-only progression approval with modeled-evidence limitations and no autonomous treatment","evidence":"Evidence object: Clinician-only progression approval with modeled-evidence limitations and no autonomous treatment; compared with prediction uncertainty, baseline/counterfactual, provenance and current release/HOLD state.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable clinical review evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Clinical Review evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Data Backbone","engineering_question":"Can the rehabilitation progression / scheduling / review decision be traced to a reproducible external source rather than only a demo fixture?","method":"UCI activity/postural-transition source contract plus local landmark-session provenance","evidence":"Evidence object: UCI activity/postural-transition source contract plus local landmark-session provenance, with explicit external/reference data mode and claim boundary.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable data backbone evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Data Backbone evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Historical Intelligence","engineering_question":"How has longitudinal movement-state, transition and safety chronology changed across cohorts, runs or states?","method":"Frame/session chronology of asymmetry, state transition and progression-risk evidence","evidence":"Evidence object: Frame/session chronology of asymmetry, state transition and progression-risk evidence, with explicit external/reference data mode and claim boundary.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable historical intelligence evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Historical Intelligence evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Entity / Factor Explorer","engineering_question":"Which subject / sensor window / motion state / progression action carries the highest evidence concentration?","method":"Joint/side/movement feature ranking by asymmetry, instability and state contribution","evidence":"Evidence object: Joint/side/movement feature ranking by asymmetry, instability and state contribution, with explicit external/reference data mode and claim boundary.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable entity / factor explorer evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Entity / Factor Explorer evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Empirical Case Study","engineering_question":"Which movement-state transitions should block ference data mode and claim boundary.","required_inputs":["session / movement state","validated source/provenance","current constraints/state"],"decision_output":"Auditable data refresh evidence for rehabilitation progression / hold / reassessment","operator_action":"Rehabilitation Clinician reviews the Data Refresh evidence, drills into the responsible session / movement state, then approves, holds or escalates the rehabilitation progression / hold / reassessment."},{"workspace":"Episode Campaign","engineering_question":"Which progression action remains safe/reviewable across state-estimation realizations?","method":"Multi-seed HMM state inference + MOTION-GUARD filtering before APACE/twin escalation","evidence":"Action stability, minimum safety margin, HMM accuracy and guard score","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable episode campaign evidence for rehabilitation progression / HOLD decision","operator_action":"Progress only when the campaign remains inside the modeled safety envelope."},{"workspace":"Safety-Margin Monitor","engineering_question":"How close is the selected action to the modeled safety boundary?","method":"Distribution of MOTION-GUARD safety margin across reference episode realizations","evidence":"Minimum/mean safety margin and selected-action frequency","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable safety-margin monitor evidence for rehabilitation progression / HOLD decision","operator_action":"HOLD progression when margin becomes narrow or volatile."},{"workspace":"Progression Frontier","engineering_question":"What functional gain is available without sacrificing safety margin?","method":"Selected gain versus safety-margin frontier across candidate episode decisions","evidence":"Guard score, gain, safety margin and rejected max-gain alternative","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable progression frontier evidence for rehabilitation progression / HOLD decision","operator_action":"Choose the highest reviewable progression, not the highest nominal gain."},{"workspace":"Sensor Reliability","engineering_question":"When should state-estimation uncertainty block progression?","method":"HMM holdout accuracy and empirical movement-asymmetry evidence review","evidence":"Latent-state validation metric, asymmetry evidence and abstention triggers","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable sensor reliability evidence for rehabilitation progression / HOLD decision","operator_action":"Acquire better movement evidence or repeat assessment before progression."},{"workspace":"Twin Challenge","engineering_question":"Does the proposed action remain acceptable after APACE/digital-twin escalation?","method":"Campaign handoff from MOTION-GUARD into APACE and trajectory forecast review","evidence":"Guarded action, modeled state, predicted trajectory and safety evidence","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable twin challenge evidence for rehabilitation progression / HOLD decision","operator_action":"Escalate conflicting predictions to clinician review; never auto-progress."},{"workspace":"Episode Decision Record","engineering_question":"Can the progression recommendation be reconstructed without making a clinical efficacy claim?","method":"Auditable state \u2192 HMM \u2192 MOTION-GUARD \u2192 APACE/twin dossier with evidence boundaries","evidence":"Scenario matrix, safety margins, limitations, non-clinical claim boundary and authority","required_inputs":["patient state / movement session / intervention action","validated empirical/reference evidence","current decision constraints"],"decision_output":"Auditable episode decision record evidence for rehabilitation progression / HOLD decision","operator_action":"Clinician reviews and records the final progression/HOLD disposition."},{"workspace":"Motion Evidence Backbone","engineering_question":"Is the movement-state evidence reliable enough for a progression recommendation?","method":"UCI activity/postural-transition acquisition, state-label validation, sequence confidence and MOTION-GUARD readiness gate","evidence":"Observation count, feature count, state distribution, raw hash, state-separation accuracy/margin and non-clinical claim boundary.","required_inputs":["validated public source/provenance","raw/canonical hash and schema state","current model/algorithm readiness"],"decision_output":"Auditable motion evidence backbone evidence","operator_action":"Clinician HOLDs progression when movement-state confidence or sensor evidence is inadequate; this is not clinical efficacy evidence."}];function msel(i){let w=MOT[i];document.getElementById('motion-title').textContent=w.workspace;document.getElementById('motion-question').textContent=w.engineering_question;document.getElementById('motion-method').textContent=w.method;document.getElementById('motion-evidence').textContent=w.evidence;document.getElementById('motion-action').textContent=w.operator_action;document.querySelectorAll('#motion-nav button').forEach((b,j)=>b.classList.toggle('on',i===j))}MOT.forEach((w,i)=>{let b=document.createElement('button');b.dataset.workspace=w.workspace;b.textContent=w.workspace;b.onclick=()=>msel(i);document.getElementById('motion-nav').appendChild(b)});msel(0);async function mf(u){return (await fetch(u)).json()}Promise.all([mf('/api/ml/lifecycle'),mf('/api/agent/run'),mf('/api/EMPIRICAL/empirical')]).then(([l,a,e])=>{document.getElementById('motion-source').textContent='data: '+((e.public_data_backbone&&[e.public_data_backbone.dataset_state,(e.public_data_backbone.primary_files?.[0]?.rows??'no-rows')+' rows',(e.public_data_backbone.primary_files?.[0]?.features??'')+' fields'].filter(Boolean).join(' | '))||e.data_mode||e.source_mode||'reference');document.getElementById('motion-model').textContent=l.registry_state;document.getElementById('motion-decision').textContent=a.decision_state;document.getElementById('motion-state').textContent=a.decision_state;document.getElementById('motion-plan').innerHTML=a.chosen_tool_sequence.map(x=>'<li>'+x+'</li>').join('');document.getElementById('motion-actions').innerHTML=a.operator_actions.map(x=>'<li>'+x+'</li>').join('')});
