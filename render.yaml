services:
  - type: web
    name: rehab-ai-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn rehab_ai.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REHAB_CORS_ORIGINS
        value: "*"

